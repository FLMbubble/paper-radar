# VLM Radar — 视觉语言模型研究子方向雷达
# 采集范围统一为 VLM 大方向；tag 细分到研究子方向，
# 仪表盘能看到 VLM 内部各主题的热度与进展。
# 子方向基于 arXiv 近期高发主题归纳。

database_path: data/radar-vlm.sqlite
reports_dir: reports/vlm

arxiv:
  enabled: true
  max_results: 40

topics:
  hallucination:
    weight: 1.3
    keywords:
      - hallucination
      - hallucinate
      - faithfulness
      - faithful
      - commonsense-driven
      - model prior conflict
      - visual evidence
      - object hallucination
    arxiv_queries: &vlm_arxiv
      - 'cat:cs.CV AND ("vision-language" OR VLM OR "multimodal large")'
      - 'cat:cs.CL AND ("multimodal" OR "vision-language" OR MLLM)'
    github_queries: &vlm_github
      - 'vision language model language:Python'
      - 'LLaVA OR multimodal LLM language:Python'
  safety_robustness:
    weight: 1.2
    keywords:
      - safety
      - adversarial
      - robustness
      - attack
      - defense
      - jailbreak
      - red-teaming
      - safety neuron
      - security
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  visual_token_efficiency:
    weight: 1.2
    keywords:
      - token pruning
      - visual compression
      - token reduction
      - efficient inference
      - token compression
      - visual token
      - adaptive sampling
      - edge inference
      - token merging
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  video_understanding:
    weight: 1.2
    keywords:
      - video understanding
      - long video
      - long-form video
      - streaming video
      - temporal
      - video question answering
      - video-grounded
      - video retrieval
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  visual_grounding:
    weight: 1.1
    keywords:
      - grounding
      - referring
      - salient object
      - segmentation
      - spatial
      - region-level
      - phrase grounding
      - visual localization
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  reasoning:
    weight: 1.2
    keywords:
      - reasoning
      - chain-of-thought
      - multi-step
      - logical reasoning
      - compositional reasoning
      - spatial reasoning
      - visual reasoning
      - agentic reasoning
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  multimodal_agent:
    weight: 1.3
    keywords:
      - agentic
      - agent
      - tool use
      - tool-use
      - computer use
      - GUI agent
      - web agent
      - multimodal agent
      - autonomous agent
      - screen agent
      - browser agent
    arxiv_queries:
      - 'cat:cs.CV AND ("vision-language" OR VLM OR "multimodal large")'
      - 'cat:cs.CL AND ("multimodal" OR "vision-language" OR MLLM)'
      - 'cat:cs.HC AND ("GUI agent" OR "web agent" OR "computer use" OR "screen agent")'
    github_queries: *vlm_github
  evaluation:
    weight: 1.0
    keywords:
      - benchmark
      - evaluation
      - probing
      - assessment
      - test suite
      - leaderboard
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github
  pretraining_alignment:
    weight: 1.1
    keywords:
      - pretraining
      - pre-training
      - contrastive
      - alignment
      - fusion
      - architecture
      - prompt tuning
      - instruction tuning
      - representation learning
    arxiv_queries: *vlm_arxiv
    github_queries: *vlm_github

github:
  enabled: true
  max_results: 40
  token_env: GITHUB_TOKEN

scoring:
  paper_weight: 1.0
  repo_weight: 1.0
  star_weight: 0.05
  match_weight: 2.0
