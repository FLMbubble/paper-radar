# VLA Radar — Vision-Language-Action 研究子方向雷达
# 采集范围统一为 VLA 大方向；tag 细分到研究子方向，
# 这样仪表盘能看到 VLA 内部各主题的热度与进展。

database_path: data/radar-vla.sqlite
reports_dir: reports/vla

arxiv:
  enabled: true
  max_results: 40

topics:
  action_generation:
    weight: 1.3
    keywords:
      - action generation
      - action prediction
      - policy learning
      - diffusion policy
      - action tokenization
      - motor control
      - action chunking
      - flow matching policy
    arxiv_queries: &vla_arxiv
      - 'cat:cs.RO AND ("vision-language-action" OR VLA OR "robot manipulation" OR humanoid)'
      - 'cat:cs.LG AND ("vision-language-action" OR "embodied agent" OR "robot learning")'
    github_queries: &vla_github
      - 'OpenVLA OR vision-language-action language:Python'
      - 'robot manipulation policy language:Python'
  reward_model:
    weight: 1.2
    keywords:
      - reward model
      - reward shaping
      - reward labeling
      - success detector
      - reward function
      - outcome reward
      - process reward
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github
  data_construction:
    weight: 1.2
    keywords:
      - data construction
      - data curation
      - dataset construction
      - demonstration
      - teleoperation
      - data scaling
      - synthetic data
      - cross-embodiment
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github
  evaluation:
    weight: 1.0
    keywords:
      - evaluation
      - benchmark
      - generalization
      - robustness
      - out-of-distribution
      - OOD
      - sim-to-real
      - sim2real
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github
  pretraining:
    weight: 1.1
    keywords:
      - pretraining
      - pre-training
      - foundation model
      - backbone
      - representation learning
      - self-supervised
      - masked autoencoder
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github
  post_training:
    weight: 1.2
    keywords:
      - post-training
      - post training
      - RLHF
      - DPO
      - reinforcement learning
      - preference optimization
      - alignment
      - fine-tuning
      - instruction tuning
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github
  world_model:
    weight: 1.1
    keywords:
      - world model
      - world simulator
      - video prediction
      - dynamics model
      - model-based
      - dreamer
      - latent dynamics
    arxiv_queries: *vla_arxiv
    github_queries: *vla_github

github:
  enabled: true
  max_results: 40
  token_env: GITHUB_TOKEN

scoring:
  paper_weight: 1.0
  repo_weight: 1.0
  star_weight: 0.05
  match_weight: 2.0
