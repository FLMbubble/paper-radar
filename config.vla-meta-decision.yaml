      - 'cat:cs.CV AND ("trajectory prediction" OR "motion forecasting" AND driving)'
      - 'cat:cs.LG AND ("multi-agent trajectory" OR "agent trajectory prediction")'
    github_queries:
      - 'trajectory prediction autonomous driving language:Python'
      - 'motion prediction driving language:Python'

  driving_intent_inference:
