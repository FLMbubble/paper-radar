# Driving Reward Radar — 自动驾驶决策模型奖励信号相关研究子方向雷达
# 聚焦两条迁移路径：
#   A. Lane State / 场景理解 → 动态 Agent 级感知（从静态标签到动态交互）
#   B. Driving Agent 轨迹 → 密集奖励函数设计（TTC、安全约束、交互博弈）
# 每个子方向配有专属 arXiv 检索语句，确保覆盖 2025 年后最新工作。
#
# v2 更新：根据两轮文献检索结果，新增 11 个子方向（标记 NEW），
# 覆盖 VLM 奖励、意图条件 RL、cost map、场景图交互、逆博弈、
# 协作 VLA、走廊规划、风险场、VLA 可解释性、价值函数标注、反应式仿真。

database_path: /tmp/radar-driving-reward.sqlite
reports_dir: /tmp/reports-driving-reward

arxiv:
  enabled: true
  max_results: 50

topics:
  # ============================================================
  # A 组：场景理解与 Lane State 迁移
  # ============================================================

  lane_scene_understanding:
    weight: 1.3
    keywords:
      - lane detection
      - lane state
      - lane estimation
      - drivable area
      - scene understanding
      - scene representation
      - semantic scene
      - traffic scene
      - road scene
      - scene graph
      - scene context
    arxiv_queries:
      - 'cat:cs.CV AND (autonomous driving AND ("lane" OR "scene understanding" OR "scene representation"))'
      - 'cat:cs.RO AND ("scene understanding" OR "scene graph" AND driving)'
    github_queries:
      - 'lane detection autonomous driving language:Python'
      - 'scene understanding driving language:Python'

  agent_trajectory_prediction:
