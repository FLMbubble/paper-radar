      - 'cat:cs.CV AND ("driving intention" OR "maneuver intention" OR "behavior prediction" driving)'
    github_queries:
      - 'driving intent prediction language:Python'
      - 'intent-aware driving language:Python'

  # NEW: 场景图交互 —— 多车辆交互关系建模
  scene_graph_interaction:
